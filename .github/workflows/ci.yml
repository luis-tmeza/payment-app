name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @payment-app/frontend test
      - run: pnpm --filter @payment-app/frontend build
      - run: pnpm --dir backend exec jest --runInBand
      - run: pnpm --filter @payment-app/backend build