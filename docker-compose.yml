services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payment_app_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_app"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  payment_app_postgres: